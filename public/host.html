<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Live - Host Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Controle do Bingo</h1>
            <div id="status-bar">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span id="status" class="connecting">Conectando</span>
                    <span id="ping-value" style="margin-left: 10px; font-size: 0.8em; opacity: 0.7;"></span>
                </div>
                <div class="status-badge" style="margin-left: 0.5rem">
                    <span id="auth-status" class="unauthorized">Sem Acesso</span>
                </div>
            </div>
        </header>

        <main>
            <div id="host-controls">
                <div class="control-panel">
                    <div id="auth-indicator">Verificando autenticação...</div>
                    <div id="game-controls" class="hidden">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                            <h2 style="margin: 0; font-size: 0.9rem; font-family: var(--font-mono); color: var(--muted); letter-spacing: 1px;">PAINEL DE CONTROLE</h2>
                            <button id="reset-btn" class="danger-btn">Reiniciar Jogo</button>
                        </div>
                        <div id="number-pad" class="number-grid">
                            <!-- 1-90 buttons will be generated here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="host.js"></script>
</body>
</html>
