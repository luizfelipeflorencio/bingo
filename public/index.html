<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Live - Participant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Bingo Live</h1>
            <div id="status-bar">
                Status: <span id="status" class="connecting">Connecting...</span>
            </div>
        </header>

        <main>
            <div id="current-call-container">
                <div id="current-number-label">Current Number</div>
                <div id="current-number">--</div>
            </div>

            <div id="history-container">
                <div id="history-label">Previous Calls</div>
                <div id="history-strip"></div>
            </div>

            <div id="grid-container">
                <!-- Grid cells generated by JS -->
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
