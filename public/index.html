<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Live - Participant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Bingo Live</h1>
            <div id="status-bar">
                Status: <span id="status" class="connecting">Connecting...</span>
            </div>
        </header>

        <main>
            <div id="draw-display">
                <h2>Last Number Drawn</h2>
                <div id="current-number">--</div>
            </div>

            <div id="history">
                <h3>History</h3>
                <div id="numbers-list"></div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
