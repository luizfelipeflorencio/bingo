<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Live - Participant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Bingo ao Vivo</h1>
            <div id="status-bar">
                <div class="status-badge">
                    <span class="status-dot"></span>
                    <span id="status" class="connecting">Conectando</span>
                </div>
            </div>
        </header>

        <main>
            <div id="current-call-container">
                <div id="current-number-label">Bola Atual</div>
                <div class="number-orb">
                    <div id="current-number">--</div>
                </div>
            </div>

            <div id="history-container">
                <div id="history-label">Anteriores</div>
                <div id="history-strip"></div>
            </div>

            <div id="grid-container">
                <!-- Grid cells generated by JS -->
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
